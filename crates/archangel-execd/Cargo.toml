[package]
name = "archangel-execd"
description = "Archangel executor: the only component that mutates the system. Minimal, signed-request only, sandboxed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "archangel-execd"
path = "src/main.rs"

# --- Packaging (pre-alpha; NOT for production — see README) ----------------
# Ships the executor binary + its hardened unit. System users/dirs are
# created by the archangeld package's maintainer scripts (install it too).
[package.metadata.deb]
maintainer = "Archangel contributors <security@archangel-sec.org>"
section = "admin"
priority = "optional"
depends = "$auto, systemd, archangeld"
extended-description = """\
The archangel executor (trust tier T2): the only component that mutates \
the system, signed-request only, sandboxed. Pre-alpha: do not run in \
production."""
assets = [
    ["target/release/archangel-execd", "usr/bin/", "755"],
    ["../../systemd/archangel-execd.service", "lib/systemd/system/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/archangel-execd", dest = "/usr/bin/archangel-execd", mode = "755" },
    { source = "systemd/archangel-execd.service", dest = "/lib/systemd/system/archangel-execd.service", mode = "644" },
]

# Trust tier T2 — the only component that mutates the system. The
# dependency surface is kept deliberately minimal: every crate here is in
# the executor's TCB and a target for external audit. archangel-sandbox
# (v0.2 isolation) and archangel-audit (archangeld is what writes the log,
# architecture step 13) are intentionally NOT dependencies yet — they are
# added when the milestone that needs them lands, not before.
[dependencies]
archangel-core = { workspace = true }
archangel-config = { workspace = true }
archangel-ipc = { workspace = true }
archangel-policy = { workspace = true }
archangel-exec-format = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
ed25519-dalek = { workspace = true }

[dev-dependencies]
# Cross-process e2e: drive the REAL execd binary over a REAL Unix socket.
sha2 = { workspace = true }
archangel-core = { workspace = true }
archangel-ipc = { workspace = true }
archangel-policy = { workspace = true }
archangel-exec-format = { workspace = true }
ed25519-dalek = { workspace = true }
tokio = { workspace = true }
