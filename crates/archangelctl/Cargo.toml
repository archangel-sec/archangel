[package]
name = "archangelctl"
description = "Operator CLI for archangel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "archangelctl"
path = "src/main.rs"

# --- Packaging (pre-alpha; NOT for production — see README) ----------------
[package.metadata.deb]
maintainer = "Archangel contributors <security@archangel-sec.org>"
section = "admin"
priority = "optional"
depends = "$auto"
extended-description = """\
Operator CLI for archangel. Never privileged; holds the operator signing \
key and talks to the daemon over the control socket. Pre-alpha."""
assets = [
    ["target/release/archangelctl", "usr/bin/", "755"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/archangelctl", dest = "/usr/bin/archangelctl", mode = "755" },
]

[dependencies]
archangel-core = { workspace = true }
archangel-audit = { workspace = true }
archangel-ctl = { workspace = true }
archangel-config = { workspace = true }
archangel-exec-format = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { workspace = true }
zeroize = { workspace = true }
