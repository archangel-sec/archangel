[package]
name = "archangeld"
description = "Archangel daemon: talks to the LLM, plans, evaluates policy. Never mutates the system."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "archangeld"
path = "src/main.rs"

[dependencies]
archangel-core = { workspace = true }
archangel-ipc = { workspace = true }
archangel-policy = { workspace = true }
archangel-audit = { workspace = true }
archangel-llm = { workspace = true }
archangel-exec-format = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
ed25519-dalek = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# In-process end-to-end test: the orchestrator drives the REAL executor
# pipeline (archangel-execd) so the whole read-only spine is exercised.
archangel-execd = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
