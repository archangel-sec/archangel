[package]
name = "archangeld"
description = "Archangel daemon: talks to the LLM, plans, evaluates policy. Never mutates the system."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "archangeld"
path = "src/main.rs"

# --- Packaging (pre-alpha; NOT for production — see README) ----------------
# `cargo deb -p archangeld` / `cargo generate-rpm -p archangeld`. The
# archangeld package is the "main" package: it ships the /etc/archangel
# tree, the maintainer scripts (system users + dirs), and its own unit.
[package.metadata.deb]
maintainer = "Archangel contributors <security@archangel-sec.org>"
section = "admin"
priority = "optional"
depends = "$auto, systemd"
maintainer-scripts = "../../packaging/maintainer/"
extended-description = """\
LLM-facing archangel daemon (trust tier T3). Talks to the model and \
evaluates policy; never mutates the system itself. Pre-alpha: do not run \
in production."""
assets = [
    ["target/release/archangeld", "usr/bin/", "755"],
    ["../../systemd/archangeld.service", "lib/systemd/system/", "644"],
    ["../../packaging/etc-archangel/archangel.toml.example", "etc/archangel/", "640"],
    ["../../packaging/etc-archangel/policies/denylist.toml", "etc/archangel/policies/", "640"],
    ["../../packaging/etc-archangel/exec/README.md", "etc/archangel/exec/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/archangeld", dest = "/usr/bin/archangeld", mode = "755" },
    { source = "systemd/archangeld.service", dest = "/lib/systemd/system/archangeld.service", mode = "644" },
    { source = "packaging/etc-archangel/archangel.toml.example", dest = "/etc/archangel/archangel.toml.example", mode = "640" },
]
post_install_script = "packaging/maintainer/postinst"
pre_uninstall_script = "packaging/maintainer/prerm"

[dependencies]
archangel-core = { workspace = true }
archangel-ipc = { workspace = true }
archangel-ctl = { workspace = true }
archangel-policy = { workspace = true }
archangel-audit = { workspace = true }
archangel-llm = { workspace = true }
archangel-exec-format = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
ed25519-dalek = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# In-process end-to-end test: the orchestrator drives the REAL executor
# pipeline (archangel-execd) so the whole read-only spine is exercised.
archangel-execd = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
