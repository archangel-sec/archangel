# Runtime directory shared by archangeld (user: archangel) and
# archangel-execd (user: archangel-exec). Both users are members of the
# archangel-audit group; the setgid bit makes files (e.g. session.pub,
# the sockets) inherit that group so the peer daemon can read them.
# Mode 2770: owner+group only, never "other".
d /run/archangel 2770 archangel archangel-audit -
