# cargo-deny configuration
# Run with: cargo deny check

[graph]
all-features = true
no-default-features = false

[output]
feature-depth = 1

# --- Vulnerability database -------------------------------------------------

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

# --- Licenses ---------------------------------------------------------------

[licenses]
confidence-threshold = 0.92
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "0BSD",
]
private = { ignore = true }

[[licenses.exceptions]]
# Example only — populate as needed with explicit justification per dep.
allow = []
name = "this-crate-does-not-exist"

# --- Source registries / git ------------------------------------------------

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# --- Bans -------------------------------------------------------------------

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "warn"

# Crates we refuse to depend on.
deny = [
    # openssl-sys — we use rustls everywhere.
    { name = "openssl-sys", reason = "Use rustls-based TLS only." },
    { name = "openssl", reason = "Use rustls-based TLS only." },
    { name = "native-tls", reason = "Use rustls-based TLS only." },
    # Anything that calls home or telemeters.
    # (Add as encountered.)
]

# Skip noise on intentional duplicates of small leaf crates.
skip = []
skip-tree = []
