[package]
name = "archangel-web"
version = "0.4.0"
edition = "2021"
description = "Marketing/documentation site for the archangel package (Leptos SSR + Axum)."
license = "Apache-2.0"
publish = false

[[bin]]
name = "archangel-web"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8", features = ["ssr"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mime_guess = "2"
