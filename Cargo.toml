[workspace]
resolver = "2"
members = [
    "crates/archangel-core",
    "crates/archangel-policy",
    "crates/archangel-audit",
    "crates/archangel-llm",
    "crates/archangel-sandbox",
    "crates/archangel-exec-format",
    "crates/archangeld",
    "crates/archangel-execd",
    "crates/archangelctl",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
# MSRV policy: stable - 2 releases. Bump deliberately, in its own commit,
# with a CHANGELOG entry. If distro packaging on RHEL-family or Debian stable
# starts to break, evaluate dropping the MSRV before adopting features.
rust-version = "1.93"
license = "Apache-2.0"
authors = ["Archangel contributors"]
repository = "https://github.com/archangel-sec/archangel"
homepage = "https://archangel-sec.org"
readme = "README.md"
keywords = ["security", "linux", "ai", "agent", "sandbox"]
categories = ["command-line-utilities", "os::linux-apis"]

[workspace.dependencies]
# Local crates
archangel-core = { path = "crates/archangel-core", version = "0.0.0" }
archangel-policy = { path = "crates/archangel-policy", version = "0.0.0" }
archangel-audit = { path = "crates/archangel-audit", version = "0.0.0" }
archangel-llm = { path = "crates/archangel-llm", version = "0.0.0" }
archangel-sandbox = { path = "crates/archangel-sandbox", version = "0.0.0" }
archangel-exec-format = { path = "crates/archangel-exec-format", version = "0.0.0" }

# Async runtime
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "signal", "sync", "time"] }

# Errors
thiserror = "1"
anyhow = "1"  # binaries only; library crates use thiserror

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ciborium = "0.2"

# Crypto / secrets
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }

# HTTP client (for LLM backends) — rustls, no openssl
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }

# Linux primitives (sandbox crate)
nix = { version = "0.29", default-features = false, features = ["fs", "process", "signal", "user", "mount", "sched"] }
caps = "0.5"
seccompiler = "0.5"

# Policy matching. `regex` and `globset` (both BurntSushi) guarantee
# linear-time matching — no catastrophic backtracking / ReDoS — which is a
# security property for the compiled denylist that inspects partly
# LLM-derived strings. `unicode-perl` is required for the `\w`/`\b`/`\s`
# word-boundary anchors the denylist relies on; matching the wrong way
# here is a denylist-bypass risk, so correctness wins over binary size.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
globset = { version = "0.4", default-features = false }

# WASM policy engine
wasmtime = { version = "26", default-features = false, features = ["cranelift", "parallel-compilation"] }

# Testing
proptest = "1"
insta = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true     # security > microbenchmarks
debug = false

[profile.dev]
overflow-checks = true
debug = true

# Hardened defaults for all member crates — override only with justification.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_must_use = "deny"
unreachable_pub = "warn"
elided_lifetimes_in_paths = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Things we deliberately deny
unwrap_used = "deny"
expect_used = "warn"   # allowed only in tests and main with a justification
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
mem_forget = "deny"
indexing_slicing = "warn"
integer_division = "warn"
float_cmp = "deny"
# Style noise we accept
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"  # transitive deps; cargo-deny handles real cases
